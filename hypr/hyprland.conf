source = colors.conf

### MONITORS ###
monitor = eDP-1, 1920x1080@60, 0x0, 1


### MY PROGRAMS ###
$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun


### AUTOSTART ###
exec-once = sleep 1 && loginctl lock-session
#exec-once = uwsm app -- nm-applet
exec-once = uwsm app -- waybar  
exec-once = uwsm app -- awww-daemon
exec-once = uwsm app -- blueman-applet
exec-once = uwsm app -- swaync
#exec-once = systemctl --user start hyprpolkitagent
exec-once = uwsm app -- hyprpolkitagent
exec-once = uwsm app -- hypridle
exec-once = uwsm app -- easyeffects --gapplication-service
exec-once = matugen image ~/.config/hypr/current_wallpaper
#exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = uwsm app -- wl-paste --type text --watch cliphist store
exec-once = uwsm app -- wl-paste --type image --watch cliphist store


### ENVIRONMENT VARIABLES ###
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = GDK_BACKEND,wayland,x11,*
env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,20
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,20
env = QT_QPA_PLATFORMTHEME,qt5ct


### TAGS ###
source= ~/.config/hypr/configs/tags.conf


### LOOK AND FEEL ###
source= ~/.config/hypr/configs/looknfeel.conf


### ANIMATIONS ###
source= ~/.config/hypr/configs/UserAnimations.conf


### WINDOWRULES AND LAYERRULES ###
source = ~/.config/hypr/configs/windowrules.conf

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

render {
	new_render_scheduling = true
}

### INPUT ###
source= ~/.config/hypr/configs/input.conf


### KEYBINDS ###
source= ~/.config/hypr/configs/keybinds.conf

