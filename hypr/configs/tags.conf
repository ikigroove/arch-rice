# Мультимедиа (MPV, VLC)
windowrule = match:class (mpv|vlc), tag +multimedia_video

# Настройки сети, блютуз и архиватор
windowrule = match:class (nm-applet|nm-connection-editor|blueman-manager|org.gnome.FileRoller), tag +settings
windowrule = match:class (org.gnome.DiskUtility|wihotspot(-gui)?), tag +settings

# Системные утилиты и просмотрщики
windowrule = match:class (org.gnome.SystemMonitor), tag +viewer
windowrule = match:class (org.gnome.Evince), tag +viewer
windowrule = match:class (eog|org.gnome.Loupe), tag +viewer

