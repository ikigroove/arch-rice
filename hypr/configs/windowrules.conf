# APPLIACTIONS BLUR & OPACITY
windowrule = match:tag multimedia_video, no_blur true
windowrule = match:tag multimedia_video, opacity 1.0
windowrule = match:tag settings, opacity 0.8
windowrule = match:class org.gnome.Nautilus, opacity 0.8
windowrule = match:class (gedit|org.gnome.TextEditor|mousepad), opacity 0.9
windowrule = match:class org.pulseaudio.pavucontrol, opacity 0.9
windowrule = match:class kitty, opacity 0.9

# Настройка прозрачности для мессенджеров и тяжелых приложений (активное/неактивное окно)
# windowrule = match:class (discord|vesktop|org.telegram.desktop), opacity 0.85 0.7
windowrule = match:class Spotify, opacity 0.8 0.6

# LAYER RULES (Для слоев панели, уведомлений и меню)
layerrule = match:namespace waybar, blur true
layerrule = match:namespace waybar, ignore_alpha 0.5
layerrule = match:tag notif, ignore_alpha 0.5
layerrule = match:namespace logout_dialog, blur true

# SWAYNC BLUR & XRAY
layerrule = match:namespace swaync-control-center, blur true
layerrule = match:namespace swaync-notification-window, blur true
layerrule = match:namespace swaync-control-center, ignore_alpha 0
layerrule = match:namespace swaync-notification-window, ignore_alpha 0
layerrule = match:namespace swaync-control-center, ignore_alpha 0.5
layerrule = match:namespace swaync-notification-window, ignore_alpha 0.5
layerrule = match:namespace swaync-control-center, xray false
layerrule = match:namespace swaync-notification-window, xray false

# FLOAT & SIZE (Управление поведением окон)
windowrule = match:tag settings, float true
windowrule = match:tag viewer, float true
windowrule = match:tag multimedia_video, float true
windowrule = match:tag multimedia_video, size 900 506
windowrule = match:class org.pulseaudio.pavucontrol, float true
windowrule = match:class org.pulseaudio.pavucontrol, size 50% 60%


# Игнорирование запросов на максимизацию
windowrule = match:class .*, suppress_event maximize

# Исправление проблем перетаскивания в XWayland
windowrule = match:class ^$ match:title ^$ match:xwayland true match:float true match:fullscreen false match:pin false, no_focus true

# DIALOGUES (Диалоговые окна сохранения и открытия)
windowrule = match:title (Save As|Save a File|Pick Files), float true
windowrule = match:title (Save As|Save a File|Pick Files), size 50% 60%
windowrule = match:title (Save As|Save a File|Pick Files), center true

windowrule = match:initial_title (Open Files), float true
windowrule = match:initial_title (Open Files), size 70% 60%

# Chrome PiP
windowrule = match:title ^(Picture in picture)$, float true
windowrule = match:title ^(Picture in picture)$, pin true
windowrule = match:title ^(Picture in picture)$, size 25% 25%
windowrule = match:title ^(Picture in picture)$, move 72% 72%
windowrule = match:title ^(Picture in picture)$, opacity 1.0
