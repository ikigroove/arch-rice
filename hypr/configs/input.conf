input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_options = grp:win_space_toggle, grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1
    sensitivity = 0
    force_no_accel = false

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace
# gesture = 3, vertical, fullscreen  # (раскомментируйте, если нужен свайп вверх/вниз для фуллскрина)

device {
    name = ajazz-ajazz-nearlink-mouse
    sensitivity = -0.2
    accel_profile = flat
}

device {
    name = elan0521:01-04f3:31b1-touchpad
    accel_profile = adaptive
    sensitivity = 0.4
}
